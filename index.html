<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
        <link rel="stylesheet" href="index.css">
        <link rel="icon" type="image/png" href="IMAGES/P.png">
        <title>RONNY BEST LOGIN</title>
    </head>
    <body>
        <div class="container">
            <h2>RONNY BEST LOGIN</h2>
            <div class="signimg">
                <img src="IMAGES/P2.png" alt="MATH IMAGE">
                <p>IMPROVE YOUR MATH</p>
            </div>
            <div class="box1" >
                <h3 id="title">SIGN IN</h3>
                <label for="text">Username:</label>
                <input type="text" id="username" placeholder="Enter Username...">
                <label for="password">Password:</label>
                <input type="password" id="password" placeholder="Enter Password...">
                <button id="signbtn">Sign In</button>

                <p id="signtext">
                    New Here? <span onclick="toggleForm()">SIGN UP</span>
                </p>
                <p id="message" class="message"></p>
            </div>
        </div>

        <script src="index.js"></script>
    </body>
</html>
