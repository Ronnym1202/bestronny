# ═══════════════════════════════════════════════════════════════
# RONNY BEST MATHEMATICS — netlify.toml
# bestronny.netlify.app
#
# CSP strategy note:
# Google AdSense / Ad Quality scripts (adtrafficquality.google,
# googlesyndication.com, doubleclick.net, etc.) load resources
# dynamically from rotating subdomains determined at runtime.
# Whitelisting individual subdomains is a losing game — new ones
# surface as old ones get cleared. Wildcarding the core Google
# domain families below is the standard, maintainable approach
# for any site running AdSense + Firebase + Google Fonts under a
# strict CSP.
# ═══════════════════════════════════════════════════════════════

[build]
  publish = "."
  functions = "netlify/functions"

# ── Redirect: ensure ads.txt is always found ──
[[redirects]]
  from = "/ads.txt"
  to   = "/ads.txt"
  status = 200

# ── Redirect: www to non-www (future domain) ──
[[redirects]]
  from = "https://www.bestronny.netlify.app/*"
  to   = "https://bestronny.netlify.app/:splat"
  status = 301
  force  = true

# ── 404 fallback ──
[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404

# ═══════════════════════════════════════════════════════════════
# SECURITY + ADSENSE HEADERS — all pages
# ═══════════════════════════════════════════════════════════════
[[headers]]
  for = "/*"
  [headers.values]

    # Prevent clickjacking
    X-Frame-Options = "SAMEORIGIN"

    # Stop MIME sniffing
    X-Content-Type-Options = "nosniff"

    # XSS protection (legacy browsers)
    X-XSS-Protection = "1; mode=block"

    # Referrer policy
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Permissions policy
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

    # ── Content Security Policy ──
    # script-src  : page scripts + AdSense/Ad-Quality + Firebase + jsDelivr CDN
    # style-src   : inline styles + Google Fonts CSS + cdnjs
    # font-src    : Google Fonts + cdnjs font files
    # img-src     : self, inline data URIs, any https image host
    # connect-src : XHR/fetch targets — Firebase, EmailJS, AdSense, Google APIs
    # frame-src   : AdSense iframe ad units
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://*.google.com https://*.googlesyndication.com https://*.googleapis.com https://*.gstatic.com https://*.doubleclick.net https://*.adtrafficquality.google https://*.googletagservices.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://*.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://*.google.com https://*.googlesyndication.com https://*.googleapis.com https://*.gstatic.com https://*.adtrafficquality.google https://*.firebaseapp.com https://api.emailjs.com; frame-src https://*.google.com https://*.googlesyndication.com https://*.doubleclick.net;"

# ── Netlify Functions CORS ──
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin  = "*"
    Access-Control-Allow-Methods = "POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

# ── Cache: static assets (long cache) ──
[[headers]]
  for = "/IMAGES/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ── Cache: HTML pages (short cache, always revalidate) ──
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── ads.txt — no cache so AdSense always gets fresh copy ──
[[headers]]
  for = "/ads.txt"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type  = "text/plain"