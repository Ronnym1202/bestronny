<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="IMAGES/P2.png">
    <link rel="stylesheet" href="profile.css">
</head>

<body>

<div class="container">

    <header>
        <div class="profile-header">
            <img id="avatar" src="https://i.postimg.cc/SsWn1p7h/user.png" alt="User avatar">
            <div>
                <h2 id="displayName">Student Name</h2>
                <p id="displayEmail">example@email.com</p>
                <button id="editBtn">Edit Profile</button>
            </div>
        </div>
    </header>

    <nav class="tabs">
        <button class="tab active" data-tab="overview">Overview</button>
        <button class="tab" data-tab="progress">Progress</button>
        <button class="tab" data-tab="achievements">Achievements</button>
        <button class="tab" data-tab="settings">Settings</button>
    </nav>

    <section id="overview" class="tab-content active">
        <h3>Account Overview</h3>
        <div class="card">
            <p><strong>Joined:</strong> <span id="joinDate"></span></p>
            <p><strong>Total Tasks Solved:</strong> <span id="tasksSolved">0</span></p>
            <p><strong>Accuracy:</strong> <span id="accuracy">0%</span></p>
        </div>

        <h3>Recent Activity</h3>
        <ul id="activityList" class="activity"></ul>
    </section>

    <section id="progress" class="tab-content">
        <h3>Topic Progress</h3>

        <div class="progress-item">
            Algebra
            <div class="bar"><div id="algProg" class="fill"></div></div>
        </div>

        <div class="progress-item">
            Geometry
            <div class="bar"><div id="geoProg" class="fill"></div></div>
        </div>

        <div class="progress-item">
            Calculus
            <div class="bar"><div id="calProg" class="fill"></div></div>
        </div>
    </section>

    <section id="achievements" class="tab-content">
        <h3>Achievements</h3>
        <ul id="badgeList" class="badges"></ul>
    </section>

    <section id="settings" class="tab-content">
        <h3>Settings</h3>

        <label>
            Name:
            <input type="text" id="nameInput">
        </label>

        <label>
            Email:
            <input type="email" id="emailInput">
        </label>

        <label>
            Change Avatar URL:
            <input type="text" id="avatarInput" placeholder="RONNY BEST PROFILE IMAGE">
        </label>

        <label>
            <input type="checkbox" id="darkModeToggle">
            Enable Dark Mode
        </label>

        <button id="saveBtn">Save Changes</button>
        <button id="resetBtn" style="background: #e74c3c; margin-left: 10px;">Reset Profile</button>
    </section>
<p style="text-align:center; margin-top:15px;">
    <a href="privacy.html">Privacy Policy</a>
</p>
</div>

<script src="profile.js"></script>
</body>
</html>
